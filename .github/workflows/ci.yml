name: CI

# TEMPORARY DIAGNOSTICS, NOT FOR MERGING: runs the real-backend tests in a loop on macOS to catch
# the `tunnel_reports_429_and_port_in_use` flake with a trace of who holds the port.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  diag:
    name: diag (load ${{ matrix.load }}, part ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        load: [0, 3]
        part: [1, 2]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Machine facts
        run: |
          sysctl hw.ncpu net.inet.ip.portrange.first net.inet.ip.portrange.last net.inet.tcp.randomize_ports net.inet.tcp.msl || true
          which -a bash || true
          bash --version | head -1
          python3 --version
          python3 -c 'import socket
          ports = []
          for _ in range(5):
              s = socket.socket(); s.bind(("127.0.0.1", 0)); ports.append(s.getsockname()[1]); s.close()
          print("five bind(0) ports in a row:", ports)'
      - run: cargo test -p colab-playground-core --locked --test real_backend --no-run
      - name: Loop
        env:
          LOAD: ${{ matrix.load }}
        run: |
          n=0
          while [ "$n" -lt "$LOAD" ]; do yes > /dev/null & n=$((n + 1)); done
          fails=0
          i=0
          while [ "$i" -lt 40 ]; do
            i=$((i + 1))
            rm -f /tmp/cpg-diag.log
            if CPG_DIAG=/tmp/cpg-diag.log cargo test -p colab-playground-core --locked --test real_backend > /tmp/out.txt 2>&1; then
              echo "ok $i: listening=$(grep -c 'LISTENING' /tmp/cpg-diag.log) slow=$(grep -c 'still running after' /tmp/cpg-diag.log) used=$(grep -c 'used=true' /tmp/cpg-diag.log)"
            else
              fails=$((fails + 1))
              echo "=== FAIL iteration $i"
              grep -E "FAILED|panicked|port_in_use|never came up|test result" /tmp/out.txt || true
              echo "--- trace"
              cat /tmp/cpg-diag.log || true
              echo "=== end of iteration $i"
            fi
          done
          kill $(jobs -p) 2>/dev/null || true
          echo "fails=$fails"
