# release-please keeps a release pull request up to date on every push to main. Merging it makes
# release-please tag the release and create it as a draft; Package then attaches the downloads and
# publishes it. The whole flow and the one-time repository settings: docs/RELEASING.md.
name: Release

on:
  push:
    branches: [main]

permissions: {}

# One run at a time and never cancelled: a cancelled run could leave a draft release without its
# downloads.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commits on the release branch, the tag, the release
      issues: write # labels on the release pull request
      pull-requests: write # open and update the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Optional secret: with a token other than GITHUB_TOKEN, CI runs on the release pull
          # request without waiting for approval. Without it the built-in token is used
          # (docs/RELEASING.md).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Downloads
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # attach the files to the draft release and publish it
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
