# The rules behind these entries are in docs/DESIGN.md: the UI is built from Ely components,
# and sizes and colours come from the theme.
disallowed-methods = [
    { path = "gpui::px", reason = "take the size from the theme (`cx.theme()`), or name it in `ui::metrics` when the theme has none" },
    { path = "gpui::rems", reason = "take the size from the theme (`cx.theme()`), or name it in `ui::metrics` when the theme has none" },
    { path = "gpui::relative", reason = "use a layout helper (`w_full`, `w_1_2`, `flex_1`, ...), or name the size in `ui::metrics`" },
    { path = "gpui::rgb", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::rgba", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::hsla", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::black", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::white", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::red", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::green", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::blue", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::yellow", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::opaque_grey", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::transparent_black", reason = "use a colour token from `cx.theme().colors`; to paint nothing, leave the colour unset" },
    { path = "gpui::transparent_white", reason = "use a colour token from `cx.theme().colors`; to paint nothing, leave the colour unset" },
    { path = "gpui::Hsla::red", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::Hsla::green", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::Hsla::blue", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::Hsla::black", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::Hsla::white", reason = "use a colour token from `cx.theme().colors`" },
    { path = "gpui::Hsla::transparent_black", reason = "use a colour token from `cx.theme().colors`; to paint nothing, leave the colour unset" },

    # Paint on raw elements: a filled, outlined or raised box is an Ely component.
    { path = "gpui::Styled::bg", reason = "use the Ely component that fills the box (`Card`, `Panel`, `Well`, `ListItem`, `Badge`, ...)" },
    { path = "gpui::Styled::text_bg", reason = "use an Ely text component (`Highlight`, `Code`, `Badge`)" },
    { path = "gpui::Styled::border_color", reason = "use the Ely component that draws the line (`Divider`, `List::divided`, `Card`, `Frame`, ...)" },
    { path = "gpui::Styled::shadow", reason = "use an Ely component that is raised (`Dialog`, `Popover`, `Menu`, `HoverCard`)" },
    { path = "gpui::Styled::shadow_2xs", reason = "use an Ely component that is raised (`Dialog`, `Popover`, `Menu`, `HoverCard`)" },
    { path = "gpui::Styled::shadow_xs", reason = "use an Ely component that is raised (`Dialog`, `Popover`, `Menu`, `HoverCard`)" },
    { path = "gpui::Styled::shadow_sm", reason = "use an Ely component that is raised (`Dialog`, `Popover`, `Menu`, `HoverCard`)" },
    { path = "gpui::Styled::shadow_md", reason = "use an Ely component that is raised (`Dialog`, `Popover`, `Menu`, `HoverCard`)" },
    { path = "gpui::Styled::shadow_lg", reason = "use an Ely component that is raised (`Dialog`, `Popover`, `Menu`, `HoverCard`)" },
    { path = "gpui::Styled::shadow_xl", reason = "use an Ely component that is raised (`Dialog`, `Popover`, `Menu`, `HoverCard`)" },
    { path = "gpui::Styled::shadow_2xl", reason = "use an Ely component that is raised (`Dialog`, `Popover`, `Menu`, `HoverCard`)" },
    { path = "gpui::Styled::opacity", reason = "dim through the Ely component's own state (`disabled(..)`)" },

    # Pointer feedback and input on raw elements: anything pressable is an Ely component.
    { path = "gpui::Styled::cursor", reason = "use a pressable Ely component (`Button`, `IconButton`, `ListItem`, `NavItem`, `Link`), which sets the cursor" },
    { path = "gpui::Styled::cursor_default", reason = "use a pressable Ely component (`Button`, `IconButton`, `ListItem`, `NavItem`, `Link`), which sets the cursor" },
    { path = "gpui::Styled::cursor_pointer", reason = "use a pressable Ely component (`Button`, `IconButton`, `ListItem`, `NavItem`, `Link`), which sets the cursor" },
    { path = "gpui::Styled::cursor_text", reason = "use an Ely text field or selectable text (`Input`, `SelectableText`), which sets the cursor" },
    { path = "gpui::Styled::cursor_move", reason = "use an Ely component that moves things (`SortableList`, `SplitPane`), which sets the cursor" },
    { path = "gpui::Styled::cursor_not_allowed", reason = "use the Ely component's `disabled(..)`, which sets the cursor" },
    { path = "gpui::Styled::cursor_context_menu", reason = "use Ely's `ContextMenu`, which sets the cursor" },
    { path = "gpui::Styled::cursor_crosshair", reason = "use an Ely component, which sets its own cursor" },
    { path = "gpui::Styled::cursor_vertical_text", reason = "use an Ely text component, which sets its own cursor" },
    { path = "gpui::Styled::cursor_alias", reason = "use an Ely component, which sets its own cursor" },
    { path = "gpui::Styled::cursor_copy", reason = "use an Ely component, which sets its own cursor" },
    { path = "gpui::Styled::cursor_no_drop", reason = "use an Ely drop target (`Upload`, `SortableList`), which sets the cursor" },
    { path = "gpui::Styled::cursor_grab", reason = "use an Ely component that moves things (`SortableList`, `SplitPane`), which sets the cursor" },
    { path = "gpui::Styled::cursor_grabbing", reason = "use an Ely component that moves things (`SortableList`, `SplitPane`), which sets the cursor" },
    { path = "gpui::Styled::cursor_ew_resize", reason = "use an Ely resizer (`SplitPane`, `ResizeBorder`), which sets the cursor" },
    { path = "gpui::Styled::cursor_ns_resize", reason = "use an Ely resizer (`SplitPane`, `ResizeBorder`), which sets the cursor" },
    { path = "gpui::Styled::cursor_nesw_resize", reason = "use an Ely resizer (`SplitPane`, `ResizeBorder`), which sets the cursor" },
    { path = "gpui::Styled::cursor_nwse_resize", reason = "use an Ely resizer (`SplitPane`, `ResizeBorder`), which sets the cursor" },
    { path = "gpui::Styled::cursor_col_resize", reason = "use an Ely resizer (`SplitPane`, `ResizeBorder`), which sets the cursor" },
    { path = "gpui::Styled::cursor_row_resize", reason = "use an Ely resizer (`SplitPane`, `ResizeBorder`), which sets the cursor" },
    { path = "gpui::Styled::cursor_n_resize", reason = "use an Ely resizer (`SplitPane`, `ResizeBorder`), which sets the cursor" },
    { path = "gpui::Styled::cursor_e_resize", reason = "use an Ely resizer (`SplitPane`, `ResizeBorder`), which sets the cursor" },
    { path = "gpui::Styled::cursor_s_resize", reason = "use an Ely resizer (`SplitPane`, `ResizeBorder`), which sets the cursor" },
    { path = "gpui::Styled::cursor_w_resize", reason = "use an Ely resizer (`SplitPane`, `ResizeBorder`), which sets the cursor" },
    { path = "gpui::InteractiveElement::hover", reason = "use an Ely component that lights on hover (`Button`, `ListItem`, `NavItem`, `MenuItem`)" },
    { path = "gpui::InteractiveElement::group_hover", reason = "use an Ely component that lights on hover (`Button`, `ListItem`, `NavItem`, `MenuItem`)" },
    { path = "gpui::StatefulInteractiveElement::active", reason = "use an Ely component that shows its press (`Button`, `Pressable`)" },
    { path = "gpui::StatefulInteractiveElement::group_active", reason = "use an Ely component that shows its press (`Button`, `Pressable`)" },
    { path = "gpui::StatefulInteractiveElement::on_click", reason = "use the `on_click` of an Ely component (`Button`, `ListItem`, `NavItem`, `MenuItem`)" },
    { path = "gpui::StatefulInteractiveElement::on_aux_click", reason = "use the `on_click` of an Ely component (`Button`, `ListItem`, `NavItem`, `MenuItem`)" },
    { path = "gpui::InteractiveElement::on_mouse_down", reason = "use an Ely component's handler (`Button::on_click`, `Pressable::on_press`, `ListItem::on_secondary`)" },
    { path = "gpui::InteractiveElement::on_mouse_up", reason = "use an Ely component's handler (`Button::on_click`, `Pressable::on_press`)" },
    { path = "gpui::InteractiveElement::on_any_mouse_down", reason = "use an Ely component's handler (`Button::on_click`, `Pressable::on_press`)" },
    { path = "gpui::InteractiveElement::on_mouse_down_out", reason = "use an Ely overlay that closes on an outside press (`Popover`, `Menu`, `Dialog`)" },
    { path = "gpui::InteractiveElement::on_mouse_up_out", reason = "use an Ely component's handler (`Button::on_click`, `Pressable::on_press`)" },
    { path = "gpui::InteractiveElement::on_mouse_move", reason = "use an Ely component that follows the pointer (`Slider`, `SplitPane`, `Tooltip`)" },
    { path = "gpui::StatefulInteractiveElement::on_hover", reason = "use an Ely hover overlay (`Tooltip`, `HoverCard`)" },
    { path = "gpui::InteractiveElement::on_scroll", reason = "use Ely's `ScrollArea`" },
    { path = "gpui::InteractiveElement::on_scroll_wheel", reason = "use Ely's `ScrollArea`" },
    { path = "gpui::StatefulInteractiveElement::on_drag", reason = "use an Ely component that drags (`SortableList`, `SplitPane`)" },
    { path = "gpui::InteractiveElement::on_drop", reason = "use an Ely drop target (`Upload`, `SortableList`)" },

    # Scrolling: Ely's scroll area brings scrollbars and keeps the wheel to its axis.
    { path = "gpui::StatefulInteractiveElement::overflow_scroll", reason = "use Ely's `ScrollArea`" },
    { path = "gpui::StatefulInteractiveElement::overflow_x_scroll", reason = "use Ely's `ScrollArea`" },
    { path = "gpui::StatefulInteractiveElement::overflow_y_scroll", reason = "use Ely's `ScrollArea` (`.vertical()` for one axis)" },
]
